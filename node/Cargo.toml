[package]
name = "synterra-node"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Reference node for Synterra proof mining: keeps, relays and kernel-checks proof contributions."
repository = "https://github.com/herbertww/synterra-protocol"

# Standalone: not a member of the Anchor workspace one directory up.
[workspace]

[[bin]]
name = "synterra"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.7"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
# One codegen unit: slower builds, deterministic output (scripts/build-release.sh).
codegen-units = 1
